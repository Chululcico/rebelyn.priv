<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REBELYN · Ver web</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f6f6; color: #121212; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.04em; }
    p { margin: 0 0 16px; color: #555; line-height: 1.5; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    a.btn { display: inline-block; padding: 12px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    a.primary { background: #121212; color: #fff; }
    a.secondary { background: #fff; color: #121212; border: 1px solid #121212; }
    ul { margin: 8px 0 0 18px; color: #444; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>REBELYN · Web</h1>
      <p>Accesos rápidos para visualizar la tienda.</p>
      <ul>
        <li>Inicio: <code>/</code></li>
        <li>Productos: <code>/products</code></li>
        <li>Carrito: <code>/cart</code></li>
        <li>Cuenta: <code>/account</code></li>
      </ul>
      <div class="actions">
        <a class="btn primary" href="/">Ver inicio</a>
        <a class="btn secondary" href="/products">Ver productos</a>
        <a class="btn secondary" href="/cart">Ver carrito</a>
        <a class="btn secondary" href="/admin.html">Ir a accesos admin</a>
      </div>
    </div>
  </div>
</body>
</html>
