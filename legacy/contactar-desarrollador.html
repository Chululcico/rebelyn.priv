  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #121212;
      --paper: #ffffff;
      --muted: rgb(18 18 18 / 70%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
    }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    .logo {
      height: 4rem;
      width: auto;
    }
    h1 {
      margin: 0;
      font-size: 2.4rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(28rem, 90vw);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.95rem;
    }
    .btn-instagram { background: #1a1a1a; color: #fff; }
    .btn-back { border: 1px solid var(--ink); color: var(--ink); }
  </style>
</head>
